<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>经典 IDEA 风格主页</title>
  <style>
    :root {
      --bg: #e5e5e5;
      --window: #f7f7f7;
      --panel: #f2f2f2;
      --border: #b5b5b5;
      --border-dark: #9c9c9c;
      --border-light: #ffffff;
      --titlebar: #4c74c9;
      --titlebar-text: #ffffff;
      --text: #1f1f1f;
      --muted: #4d4d4d;
      --accent: #2b67d6;
      --select: #cfe2ff;
      --font: "Segoe UI", Tahoma, Arial, sans-serif;
      --mono: "Consolas", "Courier New", monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 12px;
    }
    .desktop {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
    }
    .window {
      width: min(1100px, 96vw);
      background: var(--window);
      border: 1px solid var(--border-dark);
      box-shadow: 0 0 0 1px var(--border-light), 0 8px 24px rgba(0,0,0,0.18);
    }
    .titlebar {
      background: linear-gradient(#5a82d6, #3f66bb);
      color: var(--titlebar-text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 3px 8px;
      font-weight: 600;
      font-size: 12px;
    }
    .controls {
      display: flex;
      gap: 4px;
    }
    .control {
      width: 16px;
      height: 16px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,0.7);
      background: rgba(255,255,255,0.25);
      color: #fff;
      font-size: 10px;
      line-height: 1;
    }
    .menubar {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 3px 8px;
      display: flex;
      gap: 14px;
      font-size: 12px;
    }
    .toolbar {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 4px 6px;
      display: flex;
      gap: 4px;
      align-items: center;
      flex-wrap: wrap;
    }
    .toolbtn {
      padding: 2px 6px;
      border: 1px solid var(--border);
      background: #fff;
      box-shadow: inset 1px 1px 0 var(--border-light);
      font-size: 11px;
      cursor: default;
    }
    .toolbtn.primary {
      border-color: #1f57c2;
      background: linear-gradient(#6aa0f0, #3e72d9);
      color: #fff;
    }
    .content {
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: 520px;
    }
    .sidebar {
      border-right: 1px solid var(--border);
      background: #fbfbfb;
      padding: 6px;
      font-size: 12px;
    }
    .side-header {
      font-weight: 600;
      color: var(--muted);
      padding: 4px 6px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 6px;
    }
    .tree {
      font-family: var(--mono);
      color: var(--muted);
    }
    .tree .node {
      padding: 2px 0 2px 14px;
      position: relative;
    }
    .tree .node::before {
      content: "▸";
      position: absolute;
      left: 0;
      color: #666;
    }
    .tree .node.active {
      background: var(--select);
      border: 1px solid #9dbcf0;
      color: #000;
      padding-left: 12px;
      margin: 2px 0;
    }
    .tree .node.active::before { content: "▾"; }
    .main {
      padding: 8px;
      background: #fff;
    }
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 6px;
      font-size: 12px;
    }
    .tab {
      padding: 3px 8px;
      border: 1px solid var(--border);
      border-bottom: none;
      background: #f5f5f5;
      color: var(--muted);
    }
    .tab.active {
      background: #ffffff;
      color: #000;
      font-weight: 600;
    }
    .editor {
      border: 1px solid var(--border);
      background: #fff;
      padding: 10px 12px;
      min-height: 360px;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.55;
    }
    .editor h1 {
      margin: 0 0 8px;
      font-size: 14px;
      font-family: var(--font);
    }
    .editor p {
      margin: 0 0 8px;
      color: var(--muted);
      font-family: var(--font);
    }
    .kv {
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 4px 10px;
      font-size: 12px;
    }
    .kv .k { color: var(--muted); }
    .statusbar {
      background: var(--panel);
      border-top: 1px solid var(--border);
      padding: 3px 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 11px;
      color: var(--muted);
    }
    .statusbar .label { color: #000; font-weight: 600; }

    @media (max-width: 900px) {
      .content { grid-template-columns: 1fr; }
      .sidebar { display: none; }
    }
  </style>
</head>
<body>
  <div class="desktop">
    <div class="window">
      <div class="titlebar">
        <div>MyHome - IntelliJ IDEA Classic UI</div>
        <div class="controls">
          <div class="control">_</div>
          <div class="control">□</div>
          <div class="control">×</div>
        </div>
      </div>

      <div class="menubar">
        <span>文件</span><span>编辑</span><span>查看</span><span>导航</span><span>代码</span><span>运行</span><span>工具</span><span>帮助</span>
      </div>

      <div class="toolbar">
        <button class="toolbtn">新建</button>
        <button class="toolbtn">打开</button>
        <button class="toolbtn">保存</button>
        <button class="toolbtn">运行</button>
        <button class="toolbtn">调试</button>
        <button class="toolbtn primary">发布</button>
        <button class="toolbtn">设置</button>
      </div>

      <div class="content">
        <aside class="sidebar">
          <div class="side-header">Project</div>
          <div class="tree">
            <div class="node active">/home</div>
            <div class="node">/projects</div>
            <div class="node">/notes</div>
            <div class="node">/contact</div>
          </div>
        </aside>

        <main class="main">
          <div class="tabs">
            <div class="tab active">README.md</div>
            <div class="tab">about.txt</div>
            <div class="tab">links.json</div>
          </div>

          <section class="editor">
            <h1>你好，我是你的名字</h1>
            <p>经典 IDEA 风格主页，紧凑、硬朗、信息密度高。</p>

            <div class="kv">
              <div class="k">角色</div><div>产品 / 设计 / 开发</div>
              <div class="k">方向</div><div>效率工具、系统化思维</div>
              <div class="k">状态</div><div>接受合作</div>
              <div class="k">更新</div><div>2026-02-07</div>
            </div>
          </section>
        </main>
      </div>

      <div class="statusbar">
        <span><span class="label">OS</span>: <span id="os">-</span></span>
        <span><span class="label">Browser</span>: <span id="browser">-</span></span>
        <span><span class="label">Language</span>: <span id="lang">-</span></span>
        <span><span class="label">Screen</span>: <span id="screen">-</span></span>
        <span><span class="label">CPU</span>: <span id="cpu">-</span></span>
        <span><span class="label">Memory</span>: <span id="mem">-</span></span>
        <span><span class="label">Time</span>: <span id="time">-</span></span>
      </div>
    </div>
  </div>

  <script>
    function detectOS(ua, platform) {
      if (/Windows NT 10/.test(ua)) return "Windows 10";
      if (/Windows NT 6\.3/.test(ua)) return "Windows 8.1";
      if (/Windows NT 6\.2/.test(ua)) return "Windows 8";
      if (/Windows NT 6\.1/.test(ua)) return "Windows 7";
      if (/Mac OS X/.test(ua)) return "macOS";
      if (/Android/.test(ua)) return "Android";
      if (/Linux/.test(ua)) return "Linux";
      return platform || "Unknown";
    }

    function detectBrowser(ua) {
      if (/Edg\//.test(ua)) return "Edge";
      if (/Chrome\//.test(ua)) return "Chrome";
      if (/Firefox\//.test(ua)) return "Firefox";
      if (/Safari\//.test(ua) && !/Chrome\//.test(ua)) return "Safari";
      return "Unknown";
    }

    function updateStatus() {
      var ua = navigator.userAgent;
      var platform = navigator.platform || "";
      var os = detectOS(ua, platform);
      var browser = detectBrowser(ua);
      var lang = navigator.language || "-";
      var screenInfo = screen.width + "x" + screen.height;
      var cpu = navigator.hardwareConcurrency ? navigator.hardwareConcurrency + " cores" : "-";
      var mem = navigator.deviceMemory ? navigator.deviceMemory + " GB" : "-";
      var now = new Date();

      document.getElementById("os").textContent = os;
      document.getElementById("browser").textContent = browser;
      document.getElementById("lang").textContent = lang;
      document.getElementById("screen").textContent = screenInfo;
      document.getElementById("cpu").textContent = cpu;
      document.getElementById("mem").textContent = mem;
      document.getElementById("time").textContent = now.toLocaleTimeString();
    }

    updateStatus();
    setInterval(updateStatus, 1000);
  </script>
</body>
</html>
